<!doctype html>
<html lang="en">
{% include head.html %}
{%- if page.path contains 'build/' -%}
<body data-view="scenarioPage" data-scenario="{{ page.name | remove: '.md' | remove: '.html' }}">
{%- else -%}
<body data-view="{{ page.name | remove: '.md' | remove: '.html' }}">
{%- endif -%}
{% include nav.html %}
<main id="main">
  <div class="prosePage">
    <div class="wrap prose">
      {%- if page.eyebrow %}<div class="sectionLabel">{{ page.eyebrow }}</div>{% endif %}
      {%- if page.title %}<h1>{{ page.title }}</h1>{% endif %}
      {{ content }}
    </div>
  </div>
</main>
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
