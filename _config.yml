title: Azure SQL Developer Hub
description: >-
  The front door for building with Azure SQL Database in the age of AI-assisted
  development. Start locally or in Azure, build with the coding agent you
  already use, and move from first prompt to production on Azure SQL.

# These two are local-preview defaults only. The deploy workflow overwrites both
# from the Pages API at build time, because where this site actually publishes
# depends on repository visibility: while the repo is private, Pages serves it
# from a generated *.pages.github.io domain at the root, and if the repo is made
# public it moves to microsoft.github.io/azure-sql-dev-hub. Editing these values
# does not change where the site deploys. See .github/workflows/pages.yml.
baseurl: ""
url: "http://localhost:4000"
repo: "https://github.com/microsoft/azure-sql-dev-hub"

# Sites this hub points at. Kept here so a link change is one edit, not twelve.
container_repo: "https://github.com/microsoft/azure-sql-database-container"
container_site: "https://microsoft.github.io/azure-sql-database-container"
skills_catalog: "https://github.com/microsoft/azure-sql-database-container/tree/main/skills"
container_signup: "https://aka.ms/sqldbcontainerpreview-signup"
azure_free_offer: "https://learn.microsoft.com/azure/azure-sql/database/free-offer"
azure_portal_hub: "https://aka.ms/azuresqlhub"
azure_sql_docs: "https://learn.microsoft.com/azure/azure-sql/"

# Web analytics (client-side). Loads only when `enabled` is true and a provider
# is configured. An Application Insights connection string is browser-embeddable
# and is not a secret, so it belongs in this file rather than in a repo secret.
#
# TODO: this hub has no Application Insights resource yet. Create one for the
# hub, paste its connection string below, and set enabled to true. The loader in
# _includes/analytics/app-insights.html and the track() helper in
# assets/js/main.js are already wired; track() logs to the console for the demo
# and fans out to App Insights the moment this is filled in.
analytics:
  enabled: false
  app_insights_connection_string: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: page

# Everything that is repository plumbing rather than a page of the site.
exclude:
  - README.md
  - CONTRIBUTING.md
  - docs
  - scripts
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
