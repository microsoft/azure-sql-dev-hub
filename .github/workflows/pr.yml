name: PR checks

# Every pull request gets the site's checks, two agent-readiness scores, a link
# check, and a visual diff against the base branch, in one comment that updates
# on each push. Nothing deploys: the built site is served inside the job, and
# a temporary public tunnel gives the agent-readiness scanner a real host to
# grade. No secrets. See docs/PR-CHECKS.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# A new push replaces the run for the previous one.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  # Pinned tools. Bump deliberately, one at a time.
  CLOUDFLARED_VERSION: "2026.10.7"
  CLOUDFLARED_SHA256: "1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872"
  OPEN_AGENT_READINESS: open-agent-readiness@0.4.0
  AGENTIC_READINESS: agentic-readiness@0.3.7
  LINKINATOR: linkinator@8.1.0
  BACKSTOPJS: backstopjs@6.3.25
  VERCEL_AUDIT: "@vercel/agent-readability@0.7.0"
  # BackstopJS drives the runner's own Chrome, so skip its browser downloads.
  PUPPETEER_SKIP_DOWNLOAD: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  checks:
    name: Checks
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      # Results collect outside the checkout, so no check scans or builds them.
      - run: |
          npm ci
          echo "REPORT=$RUNNER_TEMP/report" >> "$GITHUB_ENV"
          echo "BASE_SITE=$RUNNER_TEMP/base/_site" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/report"

      # Each check records its outcome and keeps going, so the report shows
      # every result. The last step fails the job if a blocking check failed.
      - name: House rules and telemetry
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee "$REPORT/tests.log"

      # Built for the address it is served at below (the PR on 8080, the base
      # on 8081), so its sitemap and absolute URLs point at pages a scanner
      # can fetch.
      - name: Build site
        id: build
        continue-on-error: true
        run: |
          printf 'url: "http://localhost:8080"\n' > "$RUNNER_TEMP/ci-pr.yml"
          printf 'url: "http://localhost:8081"\n' > "$RUNNER_TEMP/ci-base.yml"
          { bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/ci-pr.yml" && node scripts/build-agent-files.mjs; } 2>&1 | tee "$REPORT/build.log"

      - name: Internal links
        id: links
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-links.mjs 2>&1 | tee "$REPORT/links.log"

      # The base branch, built with this PR's gems, for the score comparison
      # and the visual diff. If it will not build, those just skip.
      - name: Build the base branch
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          base="$RUNNER_TEMP/base"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add "$base" FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" "$base/node_modules"
          (cd "$base" && BUNDLE_GEMFILE="$GITHUB_WORKSPACE/Gemfile" bundle exec jekyll build -q --config "_config.yml,$RUNNER_TEMP/ci-base.yml" && node scripts/build-agent-files.mjs)
          node scripts/check-pages.mjs --site "$BASE_SITE" --json "$REPORT/pages-base.json" || true

      - name: Page checks and score
        id: pages
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/check-pages.mjs --json "$REPORT/pages.json" --baseline "$REPORT/pages-base.json" 2>&1 | tee "$REPORT/pages.log"

      # Both builds served the way GitHub Pages serves them: the PR on 8080,
      # the base on 8081.
      - name: Serve both builds
        if: steps.build.outcome == 'success'
        run: |
          nohup node scripts/serve-site.mjs _site 8080 > "$RUNNER_TEMP/serve-pr.log" 2>&1 &
          if [ -d "$BASE_SITE" ]; then nohup node scripts/serve-site.mjs "$BASE_SITE" 8081 > "$RUNNER_TEMP/serve-base.log" 2>&1 & fi
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8080/ && exit 0; sleep 0.5; done
          exit 1

      # Lumar's agentic-readiness CLI (MIT). Fails on a published agent file
      # that is broken; files the site does not publish are not counted.
      - name: Agent files (Lumar agentic-readiness)
        id: agentfiles
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -d "$BASE_SITE" ]; then npx -y "$AGENTIC_READINESS" localhost:8081 --allow-private --json > "$REPORT/lumar-base.json" 2>/dev/null || true; fi
          npx -y "$AGENTIC_READINESS" localhost:8080 --allow-private --json > "$REPORT/lumar.json" 2> "$REPORT/lumar.log"

      # Vercel's Agent Readability Spec audit (@vercel/agent-readability, MIT),
      # run from this job against both builds, no tunnel needed. Report only.
      # It audits 5 pages picked at random from the sitemap, so each side runs
      # three times and the report takes the middle score.
      - name: Agent readability (Vercel)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            npx -y "$VERCEL_AUDIT" audit http://localhost:8080/ --json > "$REPORT/vercel-pr-$i.json" 2>> "$REPORT/vercel.log" || true
            if [ -d "$BASE_SITE" ]; then npx -y "$VERCEL_AUDIT" audit http://localhost:8081/ --json > "$REPORT/vercel-base-$i.json" 2>> "$REPORT/vercel.log" || true; fi
          done

      # open-agent-readiness (MIT) grades a whole public host and refuses
      # private addresses, so each build gets a Cloudflare quick tunnel: a
      # temporary https://<random>.trycloudflare.com for the length of the
      # scan, with no account. Report only: quick tunnels have no uptime
      # guarantee, so a failed tunnel never fails the PR.
      - name: Agent-readiness score over a public tunnel
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cf="$RUNNER_TEMP/cloudflared"
          curl -fsSL -o "$cf" "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64"
          echo "$CLOUDFLARED_SHA256  $cf" | sha256sum -c --quiet -
          chmod +x "$cf"
          scan() {
            local port=$1 name=$2 log="$RUNNER_TEMP/tunnel-$2.log" url="" pid
            "$cf" tunnel --no-autoupdate --url "http://localhost:$port" > "$log" 2>&1 &
            pid=$!
            for i in $(seq 1 30); do
              url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$log" | head -1 || true)
              [ -n "$url" ] && break; sleep 2
            done
            if [ -z "$url" ]; then echo "::warning::No tunnel for the $name build"; kill "$pid" || true; return 0; fi
            for i in $(seq 1 30); do curl -fs -o /dev/null "$url/" && break; sleep 2; done
            echo "Scanning the $name build at $url"
            npx -y "$OPEN_AGENT_READINESS" scan "${url#https://}" --json > "$REPORT/oar-$name.json" 2> "$REPORT/oar-$name.log" || true
            kill "$pid" || true
          }
          scan 8080 pr
          if [ -d "$BASE_SITE" ]; then scan 8081 base; fi

      # linkinator (MIT) from every built page, internal and external. Report
      # only: CI must not fail on someone else's outage. check-links.mjs above
      # is the blocking check for internal links and anchors.
      - name: Links (linkinator)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          pages=$(cd _site && find . -name '*.html' | sort | sed 's#^\./#http://localhost:8080/#')
          # 401, 403 and 429 mean the site turned a bot away, not that the link
          # is broken; they are counted as blocked.
          npx -y "$LINKINATOR" $pages --recurse --timeout 15000 --concurrency 8 --retry --retry-errors \
            --status-code '401:warn' --status-code '403:warn' --status-code '429:warn' \
            --skip '^http://localhost:4000' --skip 'linkedin\.com' --skip '^https://fonts\.(googleapis|gstatic)\.com/?$' \
            --format json > "$REPORT/linkinator.json" || true

      # BackstopJS (MIT): the pages this PR changed, from the base build and
      # then the PR, compared at desktop and phone widths. Pages whose built
      # output is unchanged are not captured. Report only: a PR that changes
      # the design is meant to change the pictures.
      - name: Visual diff against the base branch (BackstopJS)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          if [ ! -d "$BASE_SITE" ]; then echo "No base build to compare against"; exit 0; fi
          PAGES=$(node scripts/visual/changed-pages.mjs "$BASE_SITE" _site)
          echo "$PAGES" > "$REPORT/visual-pages.json"
          if [ "$PAGES" = "[]" ]; then echo "No page changed; nothing to capture"; exit 0; fi
          echo "Capturing $PAGES"
          export PAGES OUT_DIR="$REPORT/visual" CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          npx -y "$BACKSTOPJS" reference --config=scripts/visual/backstop.config.cjs
          npx -y "$BACKSTOPJS" test --config=scripts/visual/backstop.config.cjs || true

      - name: Write the report
        if: always()
        run: |
          cat > "$REPORT/outcomes.json" <<EOF
          {"tests":"${{ steps.tests.outcome }}","build":"${{ steps.build.outcome }}","links":"${{ steps.links.outcome }}","pages":"${{ steps.pages.outcome }}","agentfiles":"${{ steps.agentfiles.outcome }}"}
          EOF
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            node scripts/pr-report.mjs "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr-report
          path: ${{ runner.temp }}/report
          retention-days: 14

      - name: Fail on blocking checks
        if: always()
        run: |
          failed=""
          for k in tests:${{ steps.tests.outcome }} build:${{ steps.build.outcome }} links:${{ steps.links.outcome }} pages:${{ steps.pages.outcome }} agentfiles:${{ steps.agentfiles.outcome }}; do
            [ "${k#*:}" = failure ] && failed="$failed ${k%%:*}"
          done
          if [ -n "$failed" ]; then echo "Blocking checks failed:$failed"; exit 1; fi
          echo "All blocking checks passed"

  report:
    name: Report
    needs: checks
    # Same-repository branches only: a fork's workflow token cannot comment,
    # and Dependabot's runs get a read-only one. Their results are in the
    # Checks job summary instead.
    if: >-
      always() && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # changed screenshots go to the pr-assets branch
      pull-requests: write # the comment
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: pr-report
          path: ${{ runner.temp }}/report

      # Comment images need a URL, so changed screenshots are committed to the
      # pr-assets branch under pr/<number>/<run>/. Nothing deploys. Each run
      # replaces this PR's folder; closing the PR removes it.
      - name: Publish changed screenshots
        id: shots
        run: |
          node scripts/pr-report.mjs --images "$RUNNER_TEMP/report" > "$RUNNER_TEMP/images.tsv"
          if [ ! -s "$RUNNER_TEMP/images.tsv" ]; then echo "No changed screenshots"; exit 0; fi
          ref=refs/heads/pr-assets
          dest="pr/$PR/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          for i in 1 2 3 4; do
            if git ls-remote --exit-code origin "$ref" >/dev/null; then
              git fetch -q --no-tags --depth=1 origin "$ref"
              git checkout -qf -B pr-assets FETCH_HEAD
            else
              git checkout -qf --orphan "pr-assets-$i"
              git rm -rfq --ignore-unmatch .
              printf '%s\n' "# PR assets" "" "Screenshots for the PR checks comment, from .github/workflows/pr.yml." \
                "One folder per open pull request, removed when it closes. Do not edit by hand." > README.md
            fi
            rm -rf "pr/$PR"
            mkdir -p "$dest"
            while IFS=$'\t' read -r src name; do cp "$RUNNER_TEMP/report/$src" "$dest/$name"; done < "$RUNNER_TEMP/images.tsv"
            git add -A
            git commit -qm "Screenshots for #$PR at ${HEAD_SHA:0:7}"
            if git push -q origin "HEAD:$ref"; then
              echo "base=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-assets/$dest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "::warning::Could not publish screenshots; the comment links the run instead"

      - name: Post or update the PR comment
        env:
          IMAGE_BASE: ${{ steps.shots.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/pr-report.mjs "$RUNNER_TEMP/report" > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- hub-pr-report -->"))) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

  cleanup:
    name: Remove screenshots
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Delete this PR's screenshots
        run: |
          ref=refs/heads/pr-assets
          git ls-remote --exit-code origin "$ref" >/dev/null || { echo "No pr-assets branch"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          for i in 1 2 3 4; do
            git fetch -q --no-tags --depth=1 origin "$ref"
            git checkout -qf -B pr-assets FETCH_HEAD
            if [ ! -d "pr/$PR" ]; then echo "No screenshots for #$PR"; exit 0; fi
            git rm -rq "pr/$PR"
            git commit -qm "Remove screenshots for #$PR"
            if git push -q origin "HEAD:$ref"; then echo "Removed pr/$PR"; exit 0; fi
            sleep $((i * 3))
          done
          exit 1
      # The images are gone, so swap the visual section for a note rather than
      # leave broken pictures in the comment.
      - name: Update the PR comment
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- hub-pr-report -->"))) | .id' | head -1)
          [ -n "$id" ] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq .body > body.md
          node -e '
            const fs = require("fs");
            const b = fs.readFileSync("body.md", "utf8").replace(/<!-- visual -->[\s\S]*?<!-- \/visual -->/,
              "<!-- visual -->\n_Screenshots were removed when the pull request closed._\n<!-- /visual -->");
            fs.writeFileSync("body.md", b);'
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
