name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  house-rules:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      # The same command a contributor runs locally with `npm test`. One
      # definition of clean, checked in one place.
      - run: node scripts/check-house-rules.mjs

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: bundle exec jekyll build
      - run: node scripts/build-agent-files.mjs
      - run: node scripts/check-links.mjs
      # A PR that breaks the markdown twin or llms-full.txt should fail here
      # rather than ship a site whose agent-facing half is missing.
      - name: Check agent-facing files exist
        run: |
          test -s _site/index.md
          test -s _site/llms.txt
          test -s _site/llms-full.txt
          test -s _site/build/rag.md
          test ! -e _site/for-agents.html
          grep -q 'rel="alternate" type="text/markdown"' _site/index.html
          grep -q 'rel="alternate" type="text/markdown"' _site/build/rag.html
