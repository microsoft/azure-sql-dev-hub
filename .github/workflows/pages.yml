name: Deploy to GitHub Pages

# Requires Settings > Pages > Source set to "GitHub Actions" once, by hand.
# Until that is set, this workflow runs and fails at the deploy step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read # list open PRs, whose previews are published alongside

# One deploy at a time. In-progress runs finish rather than being cancelled, so
# a half-uploaded site never becomes the live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        id: pages
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      # Take the real published host and path from the Pages API rather than the
      # placeholders in _config.yml. This repository is private, so Pages serves
      # it from a generated *.pages.github.io domain at the root, not from
      # microsoft.github.io/azure-sql-dev-hub. Passing only --baseurl would fix
      # relative_url and leave absolute_url pointing at the wrong host, which is
      # exactly what llms.txt and the og:url tag are built from. Deriving both
      # here means going public, or adding a custom domain later, needs no edit.
      - name: Resolve the published URL
        run: |
          base='${{ steps.pages.outputs.base_path }}'
          if [ "$base" = "/" ]; then base=""; fi
          printf 'url: "%s"\nbaseurl: "%s"\ntelemetry_build_version: "%s"\n' \
            '${{ steps.pages.outputs.origin }}' "$base" "$GITHUB_SHA" > _config_pages.yml
          echo "Building for ${{ steps.pages.outputs.origin }}$base"
          cat _config_pages.yml
      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml,_config_pages.yml
        env:
          JEKYLL_ENV: production
      # Writes the .md twin of every page and llms-full.txt into _site. Runs
      # after Jekyll so it can add to the built output.
      - name: Build agent-facing files
        run: node scripts/build-agent-files.mjs --config _config.yml,_config_pages.yml
      # PR previews (.github/workflows/pr.yml) are built for <site>/pr/<number>/
      # and kept on the pr-previews branch. Only open PRs are published, so a
      # closed PR's preview goes away with the next deploy even if its cleanup
      # never ran. They are added after the agent files, so the live sitemap,
      # llms.txt and llms-full.txt never list them.
      - name: Add open pull request previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Full ref name: a short "pr-previews" also matches other branches' tails.
          ref=refs/heads/pr-previews
          git ls-remote --exit-code origin "$ref" >/dev/null || { echo "No pr-previews branch yet"; exit 0; }
          git fetch -q --no-tags --depth=1 origin "$ref"
          for n in $(gh pr list --state open --limit 200 --json number --jq '.[].number'); do
            if git cat-file -e "FETCH_HEAD:pr/$n" 2>/dev/null; then
              git archive FETCH_HEAD "pr/$n" | tar -x -C _site
              echo "Added preview for #$n"
            fi
          done
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
